<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img">
<title>Approved theme reference: retro cyber cel vow screen</title>
<desc>Dusk sky bands, a cel-painted skyline with lit windows, a framed CRT panel showing the vow in phosphor green, signal-red HUD corners and a crimson seal. Reference for mood, palette and composition only; not a pixel spec.</desc>
<rect width="680" height="380" fill="#1E3B36"/>
<rect y="0" width="680" height="70" fill="#2E5A4E"/>
<rect y="70" width="680" height="60" fill="#4F7F64"/>
<rect y="130" width="680" height="40" fill="#C9875A"/>
<circle cx="560" cy="150" r="46" fill="#E9B872"/>
<g stroke="#1E3B36" stroke-width="3"><line x1="510" y1="140" x2="610" y2="140"/><line x1="514" y1="154" x2="606" y2="154"/><line x1="520" y1="168" x2="600" y2="168"/></g>
<path d="M0 230 V170 H40 V150 H70 V180 H110 V120 H150 V176 H190 V140 H230 V196 H270 V160 H300 V110 H340 V180 H380 V150 H420 V200 H460 V130 H500 V176 H540 V160 H580 V190 H630 V145 H680 V230Z" fill="#143029" stroke="#0E1F1B" stroke-width="2"/>
<g fill="#E9B872"><rect x="120" y="132" width="6" height="6"/><rect x="134" y="148" width="6" height="6"/><rect x="310" y="122" width="6" height="6"/><rect x="324" y="140" width="6" height="6"/><rect x="310" y="158" width="6" height="6"/><rect x="470" y="142" width="6" height="6"/><rect x="484" y="160" width="6" height="6"/><rect x="640" y="158" width="6" height="6"/></g>
<g fill="#7FE0A0"><rect x="196" y="152" width="6" height="6"/><rect x="430" y="164" width="6" height="6"/><rect x="50" y="160" width="6" height="6"/></g>
<rect y="230" width="680" height="150" fill="#0F2420"/>
<g stroke="#1E3B36" stroke-width="1"><line x1="0" y1="250" x2="680" y2="250"/><line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/><line x1="340" y1="230" x2="40" y2="380"/><line x1="340" y1="230" x2="640" y2="380"/><line x1="340" y1="230" x2="240" y2="380"/><line x1="340" y1="230" x2="440" y2="380"/></g>
<rect x="60" y="40" width="330" height="200" rx="14" fill="#0E1F1B" stroke="#F1E7CF" stroke-width="3"/>
<rect x="72" y="52" width="306" height="176" rx="8" fill="#123026"/>
<g stroke="#163A2E" stroke-width="2"><line x1="72" y1="64" x2="378" y2="64"/><line x1="72" y1="80" x2="378" y2="80"/><line x1="72" y1="96" x2="378" y2="96"/><line x1="72" y1="112" x2="378" y2="112"/><line x1="72" y1="128" x2="378" y2="128"/><line x1="72" y1="144" x2="378" y2="144"/><line x1="72" y1="160" x2="378" y2="160"/><line x1="72" y1="176" x2="378" y2="176"/><line x1="72" y1="192" x2="378" y2="192"/><line x1="72" y1="208" x2="378" y2="208"/></g>
<text x="88" y="78" font-size="11" fill="#E05A4C" font-family="monospace">EP.01 // THE VOW</text>
<text x="88" y="104" font-size="14" fill="#7FE0A0" font-family="monospace">&gt; I made one promise.</text>
<text x="88" y="126" font-size="12" fill="#7FE0A0" font-family="monospace">&gt; Teach machines to understand</text>
<text x="102" y="142" font-size="12" fill="#7FE0A0" font-family="monospace">my language and my people.</text>
<text x="88" y="162" font-size="12" fill="#7FE0A0" font-family="monospace">&gt; Build what they can trust.</text>
<text x="88" y="182" font-size="12" fill="#7FE0A0" font-family="monospace">&gt; Guard what no one sees.</text>
<text x="88" y="204" font-size="12" fill="#F1E7CF" font-family="monospace">&gt; I don't sheathe the blade until it's</text>
<text x="88" y="220" font-size="12" fill="#E05A4C" font-family="monospace">  kept._</text>
<rect x="346" y="196" width="40" height="40" fill="#B23A2E" transform="rotate(-8 366 216)"/>
<text x="366" y="221" font-size="12" fill="#F1E7CF" text-anchor="middle" font-family="Georgia,serif" transform="rotate(-8 366 216)">MIS</text>
<g stroke="#E05A4C" stroke-width="2" fill="none"><path d="M430 260 h24 M430 260 v24"/><path d="M640 260 h-24 M640 260 v24"/><path d="M430 360 h24 M430 360 v-24"/><path d="M640 360 h-24 M640 360 v-24"/></g>
<text x="448" y="296" font-size="11" fill="#E05A4C" font-family="monospace">BLADE I   RESEARCH</text>
<text x="448" y="316" font-size="11" fill="#7FE0A0" font-family="monospace">BLADE II  ENGINEERING</text>
<text x="448" y="336" font-size="11" fill="#7FE0A0" font-family="monospace">BLADE III SECURITY</text>
<text x="40" y="364" font-size="11" fill="#4F7F64" font-family="monospace">SIGNAL OK  //  DHAKA 23:41</text>
</svg>
